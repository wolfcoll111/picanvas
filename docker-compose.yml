services:
  webtop:
    image: lscr.io/linuxserver/webtop:${DESKTOP_FLAVOR:-ubuntu-xfce}
    container_name: picanvas-webtop
    env_file:
      - config.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - TITLE=${TITLE:-PiCanvas}
    volumes:
      - ./data/config:/config
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "${CUSTOM_HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped

  # Runs only when the `tailscale` compose profile is enabled.
  # install.sh enables it automatically when USE_TAILSCALE=true.
  # host network mode lets the tailnet reach the Webtop ports on this machine.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: picanvas-tailscale
    hostname: ${TS_HOSTNAME:-picanvas}
    env_file:
      - config.env
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-picanvas}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---advertise-exit-node=false}
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    profiles:
      - tailscale
